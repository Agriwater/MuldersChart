name: Render Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: render-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RENDER_SERVICE_ID: srv-d70iii24d50c73euenj0
    steps:
      - name: Trigger and watch Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          node <<'NODE'
          const apiKey = process.env.RENDER_API_KEY;
          const serviceId = process.env.RENDER_SERVICE_ID;
          const commitId = process.env.COMMIT_SHA;

          if (!apiKey) {
            console.error('Missing GitHub secret RENDER_API_KEY.');
            process.exit(1);
          }

          const headers = {
            Authorization: `Bearer ${apiKey}`,
            Accept: 'application/json',
            'Content-Type': 'application/json',
          };

          const terminalStatuses = new Set([
            'live',
            'build_failed',
            'update_failed',
            'pre_deploy_failed',
            'canceled',
            'deactivated',
          ]);
          const successStatuses = new Set(['live']);
          const pollIntervalMs = 10000;
          const maxPolls = 90;

          async function fetchJson(url, init) {
            const response = await fetch(url, init);
            const text = await response.text();
            const data = text ? JSON.parse(text) : null;

            if (!response.ok) {
              throw new Error(`Render API ${response.status}: ${text}`);
            }

            return data;
          }

          async function main() {
            const deploy = await fetchJson(
              `https://api.render.com/v1/services/${serviceId}/deploys`,
              {
                method: 'POST',
                headers,
                body: JSON.stringify({
                  clearCache: 'do_not_clear',
                  commitId,
                }),
              },
            );

            console.log(`Started Render deploy ${deploy.id} for commit ${commitId}.`);
            console.log(`Initial status: ${deploy.status}`);

            let current = deploy;

            for (let attempt = 0; attempt < maxPolls; attempt += 1) {
              if (terminalStatuses.has(current.status)) {
                break;
              }

              await new Promise((resolve) => setTimeout(resolve, pollIntervalMs));
              current = await fetchJson(`https://api.render.com/v1/services/${serviceId}/deploys/${deploy.id}`, {
                headers,
              });
              console.log(`Deploy ${deploy.id} status: ${current.status}`);
            }

            if (!terminalStatuses.has(current.status)) {
              throw new Error(`Timed out waiting for deploy ${deploy.id}. Last status: ${current.status}`);
            }

            if (!successStatuses.has(current.status)) {
              throw new Error(`Render deploy ${deploy.id} finished with status ${current.status}.`);
            }

            console.log(`Render deploy ${deploy.id} is live.`);
          }

          main().catch((error) => {
            console.error(error instanceof Error ? error.message : String(error));
            process.exit(1);
          });
          NODE