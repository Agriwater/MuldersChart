services:
  - type: web
    name: mulders-chart
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: GRAPH_DATA_FILE
        value: /var/data/mulders-graph.json
    disk:
      name: mulders-chart-data
      mountPath: /var/data
      sizeGB: 1